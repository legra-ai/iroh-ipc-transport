name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@65a22bfa9534499fa5a9dcb44c519b5ad8c6cf9d
    with:
      breaking-change-bump: minor
      crate-name: iroh-ipc-transport
      kind: library
    secrets: inherit
