name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@5e41b92e70d9398dd2bda441f5017ffe35824b5e
    with:
      breaking-change-bump: minor
      crate-name: iroh-ipc-transport
      kind: library
    secrets: inherit
